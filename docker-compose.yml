version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - QUEUE_CONNECTION=sync
    volumes:
      - ./storage:/var/www/html/storage

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan horizon
    environment:
      - APP_ENV=production
      - QUEUE_CONNECTION=redis
    depends_on:
      - redis
      - mysql
    volumes:
      - ./storage:/var/www/html/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: garageos
      MYSQL_DATABASE: garageos
      MYSQL_USER: garageos
      MYSQL_PASSWORD: garageos
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: